        versions:
          "17.0-26.x": 0x0
      p_list_le_prev:
        description: "Previous process in global process list"
        type: pointer
        versions:
          "17.0-26.x": 0x8
      p_proc_ro:
        description: "Pointer to read-only process data (PAC-signed on arm64e)"
        type: pointer  # PAC-signed on arm64e
        versions:
          "17.0-26.x": 0x18
      p_pid:
        description: "Process ID (uint32)"
        type: uint32
        versions:
          "17.0-26.x": 0x60
      p_fd:
        description: "Pointer to filedesc (open file table)"
        type: pointer
        verified_by: pattern_match
        versions:
          "17.0-26.x": 0xd0
      p_flag:
        description: "Process flags (P_AMFI_DISABLED, P_DISABLE_ASLR, etc.)"
