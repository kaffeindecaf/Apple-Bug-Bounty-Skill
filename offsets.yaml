      kt_zv_zv_name:
        description: "Zone name string pointer (search for this to find kernel base)"
        type: pointer
        versions: { "17.0-26.x": 0x10 }

  thread:
    description: "Thread of execution — offsets vary by SoC generation AND iOS version"
    verified_by: pattern_match
    note: |
      Thread offsets shift with both iOS version AND SoC generation.
      The SoC groupings are:
        A10  — iPhone 7
        A12  — iPhone XS/XR (base for most offsets)
        A13+ — iPhone 11/SE2 and later (small delta from A12)
        A15+ — iPhone 13 and later
        A17+ — iPhone 15 Pro, M3 iPads
        A18+ — iPhone 16 and later
      See `per_soc_offset` tables below for exact values.
    fields:
      t_tro:
        description: "Thread read-only data pointer"
        type: pointer
        versions: "see thread_offsets_by_version"
      ctid:
        description: "Thread context ID"
        type: uint64
        versions: "see thread_offsets_by_version"
      mutex_lck_mtx_data:
        description: "Lock owner data (thread mutex hijacking)"
        type: uint64
        versions: "see thread_offsets_by_version"
      machine_kstackptr:
