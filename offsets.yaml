# ─────────────────────────────────────────────────
# PER-SOC THREAD OFFSETS BY iOS VERSION
# ─────────────────────────────────────────────────

thread_offsets_by_version:

  "17.0.x":
    description: "iOS 17.0 — initial release"
    socs:
      A10:  { t_tro: 0x388, ctid: 0x438, mutex: 0x3b8, kstackptr: 0x130, jop_pid: "0xdeaddead", rop_pid: "0xdeaddead", upcb: 0xf8, contextdata: 0xf0, guard_exc: 0x338, ast: 0x3ac, threads_next: 0x378, options: 0xb8 }
      A12:  { t_tro: 0x358, ctid: 0x408, mutex: 0x388, kstackptr: 0xe8, jop_pid: 0x158, rop_pid: 0x150, upcb: 0xb0, contextdata: 0xa8, guard_exc: 0x308, ast: 0x37c, threads_next: 0x348, options: 0x70 }
      A13:  { t_tro: 0x368, ctid: 0x418, mutex: 0x398, kstackptr: 0xf0, jop_pid: 0x160, rop_pid: 0x158, upcb: 0xb0, contextdata: 0xa8, guard_exc: 0x318, ast: 0x38c, threads_next: 0x358, options: 0x70 }
      A15:  { t_tro: 0x370, ctid: 0x420, mutex: 0x3a0, kstackptr: 0xf0, jop_pid: 0x168, rop_pid: 0x160, upcb: 0xb0, contextdata: 0xa8, guard_exc: 0x320, ast: 0x394, threads_next: 0x360, options: 0x70 }
      A17:  { t_tro: 0x3c0, ctid: 0x470, mutex: 0x3f0, kstackptr: 0x140, jop_pid: 0x1B8, rop_pid: 0x1B0, upcb: 0x100, contextdata: 0xf8, guard_exc: 0x370, ast: 0x3e4, threads_next: 0x3b0, options: 0xc0 }
      A18:  { t_tro: 0x370, ctid: 0x420, mutex: 0x3a0, kstackptr: 0xf0, jop_pid: 0x168, rop_pid: 0x160, upcb: 0x100, contextdata: 0xf8, guard_exc: 0x320, ast: 0x394, threads_next: 0x360, options: 0xc0 }

  "17.1-17.3":
    socs:
      A10:  { t_tro: 0x398, ctid: 0x448, mutex: 0x3c8, guard_exc: 0x348, ast: 0x3BC, threads_next: 0x388 }
      A12:  { t_tro: 0x368, ctid: 0x418, mutex: 0x398, guard_exc: 0x318, ast: 0x38C, threads_next: 0x358 }
      A13:  { t_tro: 0x378, ctid: 0x428, mutex: 0x3a8, guard_exc: 0x328, ast: 0x39c, threads_next: 0x368 }
      A15:  { t_tro: 0x380, ctid: 0x430, mutex: 0x3b0, guard_exc: 0x330, ast: 0x3A4, threads_next: 0x370 }
      A17:  { t_tro: 0x3d0, ctid: 0x480, mutex: 0x400, guard_exc: 0x380, ast: 0x3F4, threads_next: 0x3c0 }

  "17.4-17.7":
    socs:
      A10:  { t_tro: 0x3a0, ctid: 0x450, mutex: 0x3d0, guard_exc: 0x350, ast: 0x3c4, threads_next: 0x390, task_exc_guard: 0x59c }
      A12:  { t_tro: 0x370, ctid: 0x420, mutex: 0x3a0, guard_exc: 0x320, ast: 0x394, threads_next: 0x360, task_exc_guard: 0x5bc }
      A13:  { t_tro: 0x380, ctid: 0x430, mutex: 0x3b0, guard_exc: 0x330, ast: 0x3a4, threads_next: 0x370, task_exc_guard: 0x5bc }
      A15:  { t_tro: 0x388, ctid: 0x438, mutex: 0x3b8, guard_exc: 0x338, ast: 0x3ac, threads_next: 0x378, task_exc_guard: 0x5d4 }
      A17:  { t_tro: 0x3d8, ctid: 0x488, mutex: 0x408, guard_exc: 0x388, ast: 0x3fc, threads_next: 0x3c8, task_exc_guard: 0x5d4 }
      A18:  { t_tro: 0x3E0, ctid: 0x4a0, mutex: 0x410, guard_exc: 0x390, ast: 0x404, threads_next: 0x3D0, task_exc_guard: 0x5DC }

