# Apple-Bug-Bounty-Skill — Offsets Database
# Canonical source for kernel struct offsets, memory layout constants,
# and hardware-specific values across iOS versions and SoCs.
#
# Format:
#   struct:
#     description: "..."
#     verified_by: KDK | pattern_match | documentation
#     fields:
#       field_name:
#         description: "..."
#         type: uint64 | uint32 | uint8 | pointer
#         versions:
#           "version_range":
#             value: hex_or_decimal
#             soc_variants:
#               soc_name: hex_or_decimal  # only when SoC-specific
#
# Constants are at the bottom under `constants:`.
#
# Usage: skills reference this file instead of hardcoding offsets.
#   "See offsets.yaml → proc.p_proc_ro for the correct value per iOS version."
#
# Last updated: 2026-08-11

meta:
  canonical: true
  replaces_hardcoded_offsets_in:
    - skills/ios-kernel-exploit.md
    - skills/ios-sandbox-escape.md
    - skills/ios-code-injection.md
    - skills/ios-bootchain-exploit.md
    - projects/FilzaJailedDS/kexploit/offsets.m
    - projects/excalibur/darksword-kexploit-fun/kexploit/offsets.m
  source_files:
    kdk_dump: projects/FilzaJailedDS/kexploit/offsets.m
    pattern_scan: projects/FilzaJailedDS/kexploit/offsets.m
    static_info: projects/kfd/kfd/libkfd/info/static_info.h

# ─────────────────────────────────────────────────
# KERNEL STRUCT OFFSETS
# ─────────────────────────────────────────────────

structs:

  proc:
    description: "Process structure — the kernel's representation of a running process"
    verified_by: KDK
    fields:
