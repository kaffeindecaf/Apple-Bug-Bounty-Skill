        type: uint64
        versions: "see thread_offsets_by_version"
      mach_exc_info_os_reason:
        description: "Mach exception OS reason"
        type: uint64
        versions: "see thread_offsets_by_version"
      mach_exc_info_exception_type:
        description: "Mach exception type"
        type: uint64
        versions: "see thread_offsets_by_version"
      ast:
        description: "Asynchronous system trap flags"
        type: uint32
        versions: "see thread_offsets_by_version"
      task_threads_next:
        description: "Next thread in task's thread list (for thread traversal)"
        type: pointer
        versions: "see thread_offsets_by_version"
      options:
        description: "Thread options flags"
        type: uint32
