# ─────────────────────────────────────────────────
# CONSTANTS
# ─────────────────────────────────────────────────

constants:
  t1sz:
    description: "Translation Table Level 1 Size — determines address width and SMR decoding"
    values:
      A12_15: { value: 25, hex: "0x19", address_bits: 47, paging: "4-level (standard TTBR encoding)" }
      A16_plus: { value: 17, hex: "0x11", address_bits: 47, paging: "4-level (different TTBR encoding)" }
    usage: "SMR decode: bits = (smr_base << (62 - t1sz_boot)). Wrong T1SZ → all SMR pointers corrupt."

  smr_base:
    description: "Signed Memory Region base — used in SMR pointer decoding"
    values:
      pre_17: { value: 1, note: "older iOS versions" }
      17_26: { value: 2, note: "iOS 17.0-26.x" }
    usage: "kread_smrptr(va) uses smr_base to decode. If wrong, every SMR-decoded pointer is corrupt."

  vm:
    min_kernel_address:
      iphone: "0xFFFFFFDC00000000"
      ipad_m_series: "0xFFFFFE0000000000"
    max_kernel_address:
      iphone: "0xFFFFFFFBFFFFFFFF"
      ipad_m_series: "0xFFFFFE8FFFFFFFFF"

  mach_o:
    magic_64: "0x100000cfeedfacf"
    cputype:
      ios_16_18: "0xC00000002"
      ios_26: "0xCC0000002"
    link_addr: "0xFFFFFFF007004000"

  pac:
    strip_mask_typical: "0x7FFFFFFFFFF"
    string_discriminators:
      pc: "0x7481000000000000"
      lr: "0x77d3000000000000"
      sp: "0xcbed000000000000"
      fp: "0x4517000000000000"
    instructions:
      pacia_x16_x17: "0xDAC10230"
      xpaci_x0: "0xDAC143E0"

  code_signing:
    flags:
      CS_HARD: "0x100"
      CS_KILL: "0x200"
      CS_RESTRICT: "0x800"
    lc_code_signature: "0x1D"

  mount:
    MNT_RDONLY: "0x00000001"
    FWRITE: "0x00000002"

  rop:
    loop_gadget: "0x00000014"
    thread_state_size: "0x360"
    arm_sp_alignment: 16

  perfmon:
    cdevsw_major: "0x11"

  checkm8:
    ios_27_0b2:
      ibss_image4_validate: "0x23EFC"
      ibss_boot_args_ptr: "0x2B0F4"
      ibss_boot_args_string: "0xD3960"
      txm_queryModule0: "0x39ca8"
      txm_queryModule1: "0x39e10"
      txm_queryModule2: "0x39fa4"
      txm_constraints_sig: "0x3f510"
      txm_allowedBeforeSecure: "0x2bcb4"
      mobileactivationd_should_hactivate: "0x2EBB14"

  webkit:
    ios_18_4:
      worker_global_markers: ["0x11111111", "0x22222222", "0x33333333"]
      imagebuffer_class_ptr_offset: "0x20"
      gpu_ipc:
        CreateShader: "0x446"
        CompileShader: "0x432"
        ShaderSource: "0x496"
        GetShaderSource: "0xF25"
        BufferData: "0x426"

  ipc:
    ipc_entry_size: "0x18"
    early_krw_length: "0x20"

