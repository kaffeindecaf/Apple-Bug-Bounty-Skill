# ─────────────────────────────────────────────────
# VALIDATION PATTERNS
# ─────────────────────────────────────────────────

validation:
  proc_self_pid: "kread32(proc + off_p_pid) == getpid()"
  proc_ro_valid: "is_kaddr_valid(xpaci(kread64(proc + off_p_proc_ro)))"
  apfs_fsnode_mode: "mode & 0777 should be a valid POSIX permission (0-0777)"
  kernel_base_find: "search backward from kalloc_type_view zv_name for 0xFEEDFACF"
  kernel_base_verify: "addr+8 should be 0xC00000002 (iOS 16-18) or 0xCC0000002 (iOS 26)"
